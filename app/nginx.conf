server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # gzip
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    text/plain text/css text/javascript application/javascript
    application/json image/svg+xml application/xml font/woff font/woff2;

  # Long cache for hashed assets
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Static media: shorter cache, still long
  location ~* \.(?:jpg|jpeg|png|webp|gif|svg|ico|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # SPA fallback (hash router – aber sicher ist sicher)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Don't cache the entry point
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
}
